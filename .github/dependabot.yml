version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Security updates only; no routine version-bump PRs.
    open-pull-requests-limit: 0
    groups:
      # vite and @vitejs/plugin-react must move together, or npm install fails on the peer range.
      vite:
        applies-to: security-updates
        patterns:
          - vite
          - "@vitejs/*"
